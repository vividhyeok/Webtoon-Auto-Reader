name: Verify and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
      - run: npm run test:browser
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: webtoon-auto-reader
          path: dist/*.zip
